server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # HTML — no cache, deploys rápidos
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Assets imutáveis — cache 1 ano
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Images / fonts — cache 30 dias
  location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # Fallback HTML — Next.js static export gera /sucesso.html, /politica-de-privacidade.html
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  # Health check pra EasyPanel
  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
